server:
  port: 8080
  # CloudFront routes /api/* to this service and forwards the prefix as-is (see
  # infra/lib/constructs/frontend-stack.ts), so every mapping lives under /api.
  servlet:
    context-path: /api

spring:
  servlet:
    multipart:
      # Default (1MB) is too small for a real phone photo of a receipt.
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

cognito:
  issuer-uri: ${COGNITO_ISSUER_URI:}

split-manager:
  env-name: ${ENV_NAME:local}
  table-name: ${TABLE_NAME:split-manager-local-ledger}
  images-bucket-name: ${IMAGES_BUCKET_NAME:split-manager-local-receipt-images}
  statements-bucket-name: ${STATEMENTS_BUCKET_NAME:split-manager-local-statements}
  frontend-origin: ${FRONTEND_ORIGIN:}
  classification:
    # Above this, an unrecognised statement charge is guessed to be a split. Low enough
    # to catch a shared dinner, high enough to leave ordinary solo spending alone.
    split-amount-threshold: ${SPLIT_AMOUNT_THRESHOLD:40.00}
